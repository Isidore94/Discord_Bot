name: Weekly Discord Trade Summary

on:
  schedule:
    # 13:43 UTC every Sunday == 6:43am PDT / 5:43am PST. GitHub queues scheduled
    # runs on shared capacity and routinely starts this one 50-60 minutes late,
    # so treat the cron as the earliest possible time, not the actual one. The
    # hour is chosen so even an on-time run lands after 05:00 local in winter,
    # and an hour-late one still lands in the morning; the odd minute avoids the
    # top-of-hour rush, which is where most of the delay comes from. Runs half
    # an hour behind the avail check so the two don't queue against each other.
    - cron: "43 13 * * 0"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-fetch the full history window instead of resuming"
        type: boolean
        default: false
      post:
        description: "Post to Discord (untick to preview in the job summary only)"
        type: boolean
        default: true

permissions:
  contents: write  # allow committing the updated running log back to the repo

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Post weekly trade summary
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Optional repo variables; the live channels are the defaults.
          SOURCE_CHANNEL_ID: ${{ vars.SOURCE_CHANNEL_ID }}
          TARGET_CHANNEL_ID: ${{ vars.TARGET_CHANNEL_ID }}
        # The event guard matters: on the cron schedule `inputs.post` is null,
        # which compares equal to false, and the summary must still post.
        run: |
          python weekly_summary.py \
            ${{ inputs.backfill && '--backfill' || '' }} \
            ${{ github.event_name == 'workflow_dispatch' && inputs.post == false && '--no-post' || '' }}

      - name: Commit updated running log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain trade_log.json)" ]; then
            git add trade_log.json
            git commit -m "Update trade running log [skip ci]"
            git push
          else
            echo "No changes to the running log."
          fi
